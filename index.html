<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive To-Do List - Alfred Habre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>My To-Do List</h1>
    <p class="student">Alfred Habre</p>

    <form id="taskForm">
      <input id="taskInput" type="text" placeholder="Enter a task">
      <button type="submit">Add Task</button>
    </form>

    <p id="feedback"></p>
    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
